name: bench_viz
description: Sampling wrapper around benchmark_harness + log-scale histogram renderer.
publish_to: none
environment:
  sdk: ^3.4.0

dependencies:
  benchmark_harness: ^2.3.1
  vector_math: ^2.1.4
  convert: ^3.1.0
  crypto: ^3.0.0
  meta: ^1.10.0
  ffi: ^2.0.0
  args: ^2.4.0
  path: ^1.9.0
  fixnum: ^1.1.0

dependency_overrides:
  benchmark_harness:
    path: ./shim_benchmark_harness
